:root{--page:#E3EAEF;--navy:#0E2536;--azul:#1E415B;--or:#FD5B00;--bg:#F4F7FA;--mut:#4A5B64;--line:#DCE4E8;--err:#B3261E;--tonal:#D3E4F0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins','Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.4;color:var(--navy);background:var(--page);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2F7FD8;outline-offset:2px}
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{display:block;flex:none}

/* página */
.stage{min-height:100%;display:flex;justify-content:center;align-items:center;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
.side{width:290px;flex:none;position:sticky;top:20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 40px);overflow:auto}
.scard{background:#fff;border-radius:18px;padding:16px;box-shadow:0 0 0 1px rgba(14,37,54,.06)}
.scard h2{font-size:14px;font-weight:700;margin-bottom:8px}
.sbrand{display:flex;align-items:center;gap:12px}
.sbrand svg{width:64px;height:41px;flex:none}
.sbrand b{display:block;font-size:14px}.sbrand span{font-size:12.5px;color:var(--mut)}
.idx{display:flex;flex-direction:column;gap:4px}
.idx button{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;font-weight:600;font-size:13.5px}
.idx button[aria-current=true]{background:var(--tonal);font-weight:700}
.idx small{color:var(--mut);font-weight:400;font-size:12px}
.steps{padding-left:18px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.devwrap{position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;background:var(--bg);border-radius:36px;overflow:hidden;box-shadow:0 24px 60px rgba(14,37,54,.28),0 0 0 1px rgba(14,37,54,.1)}

/* app */
#app{position:absolute;inset:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:fi .22s ease-out}
@keyframes fi{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.bar{background:var(--navy);color:#fff;height:92px;padding-top:28px;display:flex;align-items:center;flex:none}
.bar h1{font-size:22px;font-weight:700;flex:1;margin-left:4px}
.bar .sp{width:16px;flex:none}
.ib{width:48px;height:48px;display:grid;place-items:center;color:#fff;border-radius:24px}
.ib:active{background:rgba(255,255,255,.18)}
.content{flex:1;min-height:0;overflow-y:auto;padding:16px}
.sub{font-size:14px;color:var(--mut);line-height:1.45}
.row{display:flex;align-items:center}
.card{background:#fff;border-radius:20px}
.hero{background:var(--navy);padding:56px 0 28px;display:flex;justify-content:center;flex:none}
.hero svg{width:180px;height:auto;display:block}
.ht{font-size:24px;font-weight:700;text-align:center;line-height:1.3}

/* campos */
.fld{margin-top:12px}
.fbox{position:relative;height:56px}
.fbox input{width:100%;height:56px;border:1px solid #6F8089;border-radius:12px;background:transparent;padding:0 16px;font-size:16px;transition:border-color .15s,box-shadow .15s}
.fbox input[type=password]{padding-right:96px}
.fbox input.pw{padding-right:96px}
.fbox textarea{width:100%;height:104px;border:1px solid #6F8089;border-radius:12px;background:transparent;padding:16px;font-size:16px;resize:none;transition:border-color .15s}
.fbox.ta{height:104px}
.fbox input:focus,.fbox textarea:focus{outline:none;border:2px solid var(--azul);padding-left:15px}
.fbox label{position:absolute;left:12px;top:15px;padding:0 4px;color:var(--mut);font-size:15px;pointer-events:none;transition:all .15s;background:var(--bg)}
.fbox input:focus+label,.fbox input:not(:placeholder-shown)+label,.fbox textarea:focus+label,.fbox textarea:not(:placeholder-shown)+label{top:-10px;font-size:12px}
.fbox input:focus+label,.fbox textarea:focus+label{color:var(--azul)}
.fld.bad .fbox input,.fld.bad .fbox textarea{border:2px solid var(--err)}
.fld.bad .fbox label{color:var(--err)}
.tri{position:absolute;right:6px;top:4px;display:flex;align-items:center;height:48px}
.eye{width:48px;height:48px;display:grid;place-items:center;color:var(--mut)}
.ferr{display:flex;gap:6px;align-items:flex-start;padding:0 16px;color:var(--err);font-size:12px;max-height:0;opacity:0;overflow:hidden;transition:max-height .25s,opacity .25s,margin .25s}
.ferr.show{max-height:48px;opacity:1;margin-top:4px}
.chk{display:flex;align-items:center;gap:6px;min-height:48px;width:100%;margin-top:4px}
.cb{width:18px;height:18px;border-radius:3px;border:2px solid #6F8089;display:grid;place-items:center;margin:0 9px}
.chk[aria-checked=true] .cb{background:var(--azul);border-color:var(--azul)}

/* botones */
.obtn{height:52px;border-radius:26px;background:var(--or);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .1s}
.obtn:active{transform:scale(.98)}
.obtn[disabled]{cursor:progress}
.tbtn{height:52px;border-radius:26px;background:var(--tonal);color:var(--navy);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.lbtn{height:52px;border-radius:26px;box-shadow:inset 0 0 0 1.5px #6F8089;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.txt{color:var(--azul);font-weight:600;font-size:14px;text-align:center;width:100%;min-height:44px}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* panel */
.tile{flex:1;border-radius:14px;padding:10px 12px}
.tile b{display:block;font-size:28px;line-height:1.2}.tile span{font-size:12px;font-weight:600}
.s-libre{background:#DDF1E4;color:#14532D}.s-ocupado{background:#FDEBCB;color:#6B4100}.s-excedido{background:#F9D3CF;color:#7F1710}
.ibtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{border-radius:16px;min-height:96px;padding:14px;display:flex;align-items:center;width:100%;transition:background-color .4s}
.pc.s-excedido{box-shadow:inset 0 0 0 2px #B3261E}
.pn{font-weight:700;font-size:14px}.ps{font-size:12px;font-weight:600}.tm{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.blink{animation:bl 1.3s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.pop{animation:pp .28s ease-out}
@keyframes pp{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* detalle */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:6px 14px;font-size:14px;font-weight:700}
.ringw{position:relative;width:208px;height:208px}
.ringw>svg{display:block;transform:rotate(-90deg)}
.prg{stroke-dasharray:609.5;transition:stroke-dashoffset 1s linear,stroke .4s}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.info{flex:1;padding:12px 14px;border-radius:16px}.info small{display:block;font-size:12px;color:var(--mut)}.info b{font-size:16px}
.ur{display:flex;justify-content:space-between;padding:12px 0;font-size:14px;border-top:1px solid var(--line)}.ur:first-child{border-top:0}

/* reporte */
.fc{height:32px;border-radius:8px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px #6F8089;color:var(--mut)}
.fc[aria-pressed=true]{background:var(--tonal);color:var(--navy);box-shadow:none}
.photo{width:180px;height:180px;border-radius:24px;overflow:hidden}
.photo.sm{width:150px;height:150px;border-radius:20px}

/* alertas */
.al{border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.al.done{background:#E7EDF1;color:#3C4D56}
.al.s-excedido{box-shadow:inset 0 0 0 0}
.tb2{background:var(--tonal);color:var(--navy);border-radius:20px;padding:8px 16px;font-size:13px;font-weight:700;min-height:36px}
.tx{color:var(--azul);padding:8px 10px;font-size:13px;font-weight:700;min-height:36px}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:#7B8B95;flex:none;transition:background-color .2s}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s}
.sw.on{background:var(--azul)}.sw.on i{transform:translateX(20px)}

/* menú inferior */
.nav{height:80px;flex:none;background:#fff;display:flex;justify-content:space-around;align-items:flex-start;padding-top:12px;box-shadow:0 -1px 0 #E3EAEF}
.ni{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;width:90px;color:var(--mut);font-weight:600}
.ni[aria-current=page]{color:var(--navy);font-weight:700}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;transition:background-color .2s}
.ni[aria-current=page] .pill{background:var(--tonal)}
.nb{position:absolute;top:0;right:12px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--err);color:#fff;font-size:10.5px;font-weight:600;line-height:16px;text-align:center}
.nb[hidden]{display:none}

/* avisos */
#pushwrap,#snackwrap,#dialogwrap{position:absolute;left:0;right:0;z-index:60;pointer-events:none}
#pushwrap{top:0}#snackwrap{bottom:0}#dialogwrap{inset:0}
.push{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;width:calc(100% - 20px);margin:10px 10px 0;padding:12px 14px;background:#fff;border-radius:18px;border:2px solid var(--err);box-shadow:0 12px 32px rgba(14,37,54,.38);transform:translateY(-140%);opacity:0;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s;text-align:left}
.push.show{transform:none;opacity:1}

  S = { user: null, queue: 3, vib: true, perm: 'ask', cam: 'ask', seq: 3, uses: [], repList: [], alerts: [],
    rooms: [1, 2, 3, 4].map(id => ({ id, start: SEED[id] == null ? null : BASE_MS - SEED[id] * MIN, items: SEED[id] == null ? 0 : ({ 1: 2, 2: 4, 3: 3, 4: 5 })[id], pre: false, over: false })) };
  S.rooms.forEach(r => { if (r.start) { const el = (now() - r.start) / 1000; r.pre = el >= LIM - 120; r.over = el >= LIM; } });
  const durs = { 1: [11, 12, 9], 2: [10, 9, 13], 3: [12, 11, 15], 4: [9, 12, 10] };
  S.rooms.forEach(r => {
    let end = (r.start != null ? r.start : BASE_MS - 5 * MIN) - 8 * MIN;
    durs[r.id].forEach(d => { S.uses.push({ room: r.id, start: end - d * MIN, end, dur: d }); end = end - d * MIN - 7 * MIN; });
  });
  S.alerts = [{ id: 2, room: 3, kind: 'pre', at: BASE_MS - MIN, done: false }, { id: 1, room: 4, kind: 'over', at: BASE_MS - 2 * MIN, done: false }, { id: 3, room: 1, kind: 'over', at: BASE_MS - 40 * MIN, done: true }];
  S.repList = [
    { id: 1, room: 2, marca: 'Zara', modelo: 'Blazer', talla: 'S', label: true, sku: '7305', desc: 'Blazer gris con botones dorados.', photos: [0, 1, 2], at: BASE_MS - 95 * MIN },
    { id: 2, room: 3, marca: 'Nike', modelo: '', talla: '42', label: false, sku: '', desc: 'Zapatilla blanca, pie izquierdo.', photos: [3], at: BASE_MS - 170 * MIN }
  ];
  S.rooms.forEach(r => { r._s = status(r); });
  F = { email: DEMO.email, pass: DEMO.pass, suc: 'Plaza Norte', t: {}, sub: false, show: false, busy: false, remember: true, authErr: false };
  R = newR(0);
}
const room = id => S.rooms.find(r => r.id === id);
const elapsed = r => (r.start ? (now() - r.start) / 1000 : 0);
const status = r => (!r.start ? 'libre' : elapsed(r) >= LIM ? 'excedido' : 'ocupado');
const counts = () => { const c = { libre: 0, ocupado: 0, excedido: 0 }; S.rooms.forEach(r => c[status(r)]++); return c; };
const pend = () => S.alerts.filter(a => !a.done).length;
const lastRep = id => S.repList.find(x => x.room === id);
const canCall = () => !!(S.rooms.find(r => !r.start) && S.queue > 0);
const waitEst = () => Math.ceil(S.queue * 10 / S.rooms.length);

function patchErr(id) {

const SUCS = ['Costanera Center', 'Mall Vespucio', 'Mall Tobalaba', 'Plaza Norte', 'Parque Arauco', 'Plaza Oeste', 'Florida Center'];

function wheelTo(target, dur = 280) {
